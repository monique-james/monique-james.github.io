<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monique James - Journalism Portfolio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Social Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        purpleBrand: '#6B21A8',      /* Primary purple accent */
                        purpleHover: '#581C87',      /* Darker purple for button hover */
                        purpleLight: '#8B5CF6',      /* Brighter purple highlight */
                        bgCream: '#F5F3F7',          /* Subtle off-white/cream background */
                    },
                    fontFamily: {
                        serif: ['"Times New Roman"', 'Times', 'Georgia', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: "Times New Roman", Times, Georgia, serif;
            background-color: #F5F3F7;
            color: #1A1A1A;
        }

        /* Overlapping text effect mimicking the reference layout */
        @media (min-width: 1024px) {
            .hero-title {
                margin-right: -4rem;
                z-index: 20;
                position: relative;
            }
        }
    </style>
</head>

<body class="min-h-screen flex flex-col justify-between selection:bg-purpleBrand selection:text-white">

    <!-- Top Navigation Bar -->
    <header class="w-full max-w-7xl mx-auto px-6 sm:px-10 py-8 flex justify-between items-center">
        <!-- Logo / Name -->
        <a href="#"
            class="text-lg sm:text-xl font-bold tracking-tight text-purpleBrand hover:opacity-80 transition-opacity">
            Monique James
        </a>

        <!-- Navigation Links -->
        <nav class="flex items-center space-x-6 sm:space-x-10 text-base sm:text-lg text-purpleBrand">
            <a href="#about" class="hover:underline underline-offset-4 transition-all">About</a>
            <a href="#writing" class="hover:underline underline-offset-4 transition-all">Writing</a>
            <a href="#photography" class="hover:underline underline-offset-4 transition-all">Photography</a>
            <a href="#contact" class="hover:underline underline-offset-4 transition-all">Contact</a>
        </nav>
    </header>


    <!-- Footer / Secondary Section -->
    <footer id="contact" class="w-full max-w-7xl mx-auto px-6 sm:px-10 pt-16 pb-12 mt-12 border-t border-purple-200/50">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-end gap-6">

            <!-- Left Side Footer Info -->
            <div class="space-y-2">
                <h2 class="text-2xl sm:text-3xl font-bold uppercase tracking-wide text-purpleBrand">
                    Monique James
                </h2>
                <div>
                    <!-- Main Hero Section -->
                    <main class="w-full max-w-7xl mx-auto px-6 sm:px-10 py-6 md:py-12 flex-grow flex items-center">
                        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-0 items-center w-full">

                            <!-- Hero Left: Bio & Heading -->
                            <div class="lg:col-span-7 flex flex-col items-start hero-title pr-0 lg:pr-4">
                                <h1
                                    class="text-6xl sm:text-7xl md:text-8xl lg:text-9xl font-bold text-purpleBrand tracking-tight leading-none mb-6">
                                    Hi, I’m Monique
                                </h1>

                                <p
                                    class="text-2xl sm:text-3xl md:text-4xl text-purpleBrand font-normal leading-snug max-w-2xl mb-8 sm:mb-12">
                                    I am a junior journalism major writing on <span class="italic">representation in
                                        sports</span>.
                                </p>

                                <a href="#about"
                                    class="inline-block bg-purpleBrand hover:bg-purpleHover text-white text-lg sm:text-xl px-8 py-3 shadow-md hover:shadow-lg transition-all duration-200">
                                    About Me
                                </a>
                            </div>
                            <!-- Hero Right: Portrait Image Container -->
                            <!-- Hero Right: Portrait Image Container -->
                            <div class="lg:col-span-5 flex flex-col items-start">
                                <div class="w-full shadow-xl">
                                    <img src="img.jpeg" alt="Monique James"
                                        class="w-full h-auto object-contain max-h-[75vh]" />
                                </div>
                                <span class="text-xs sm:text-sm italic text-gray-500 mt-2 font-serif">
                                    Portrait by Monique James
                                </span>
                            </div>
                            </span>
                        </div>
                </div>
                </main>
                <a href="mailto:nique@uniquelycaptured.art"
                    class="text-xl sm:text-2xl italic text-purpleBrand hover:underline underline-offset-4 transition-all">
                    Contact me
                </a>
            </div>
        </div>

        <!-- Social Links (Center/Right aligned) -->
        <div class="flex items-center space-x-5 text-gray-700 text-lg pt-4 md:pt-0">
            <a href="https://twitter.com" target="_blank" rel="noopener noreferrer"
                class="hover:text-purpleBrand transition-colors" aria-label="Twitter">
                <i class="fa-brands fa-x-twitter"></i>
            </a>
            <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer"
                class="hover:text-purpleBrand transition-colors" aria-label="LinkedIn">
                <i class="fa-brands fa-linkedin-in"></i>
            </a>
            <a href="https://threads.net" target="_blank" rel="noopener noreferrer"
                class="hover:text-purpleBrand transition-colors" aria-label="Threads">
                <i class="fa-brands fa-threads"></i>
            </a>
        </div>

        </div>
    </footer>

</body>

</html>
</head>
